<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f7a53">
    <title>Meal Planner</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="styles.css?v=20260930-8">
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div>
          <p class="eyebrow">Weekly meals</p>
          <h1>Meal Planner</h1>
        </div>
        <button class="icon-button primary" id="addMealButton" type="button" aria-label="Add meal" title="Add meal">
          +
        </button>
      </header>

      <section class="week-controls" aria-label="Week navigation">
        <button class="icon-button" id="previousWeekButton" type="button" aria-label="Previous week" title="Previous week">
          &lt;
        </button>
        <div class="week-title">
          <strong id="weekLabel">Loading week</strong>
          <span id="weekRange"></span>
        </div>
        <button class="icon-button" id="nextWeekButton" type="button" aria-label="Next week" title="Next week">
          &gt;
        </button>
      </section>

      <section class="planner-wrap" aria-label="Weekly meal planner">
        <div class="planner-grid" id="plannerGrid"></div>
      </section>

      <section class="meal-bank" aria-label="Saved meals">
        <div class="section-header">
          <h2>Meals</h2>
          <span id="mealCount">0 saved</span>
        </div>
        <div class="meal-list" id="mealList"></div>
      </section>
    </main>

    <dialog class="modal" id="mealDialog">
      <form method="dialog" class="modal-panel" id="mealForm">
        <div class="modal-header">
          <h2 id="mealDialogTitle">Add Meal</h2>
          <button class="icon-button subtle" value="cancel" type="submit" formnovalidate aria-label="Close" title="Close">x</button>
        </div>
        <label>
          Meal name
          <input id="mealNameInput" name="mealName" type="text" autocomplete="off" required maxlength="80" aria-describedby="mealDuplicateWarning" placeholder="Paneer rice bowl">
        </label>
        <p class="field-warning" id="mealDuplicateWarning" role="alert" hidden></p>
        <label>
          Notes
          <textarea id="mealNotesInput" name="mealNotes" rows="4" maxlength="500" placeholder="Optional ingredients, prep notes, or links"></textarea>
        </label>
        <div class="modal-actions">
          <button class="button ghost" value="cancel" type="submit" formnovalidate>Cancel</button>
          <button class="button" id="saveMealButton" value="default" type="submit">Save meal</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="assignDialog">
      <form method="dialog" class="modal-panel" id="assignForm">
        <div class="modal-header">
          <div>
            <p class="eyebrow" id="assignSlotLabel">Meal slot</p>
            <h2>Meals for this slot</h2>
          </div>
          <button class="icon-button subtle" value="cancel" type="submit" formnovalidate aria-label="Close" title="Close">x</button>
        </div>
        <div class="assigned-meals" id="assignedMeals" aria-live="polite"></div>
        <div class="add-to-slot-controls" id="addToSlotControls">
          <label>
            Search saved meals
            <input id="mealSearchInput" type="search" autocomplete="off" placeholder="Type a meal name" aria-controls="mealSelect">
          </label>
          <label>
            Choose a meal
            <select id="mealSelect"></select>
          </label>
          <p class="slot-message" id="mealSearchMessage" role="status" hidden>No meals match your search.</p>
          <button class="button" id="addToSlotButton" value="add" type="submit">Add to this slot</button>
        </div>
        <div class="modal-actions">
          <button class="button ghost" value="cancel" type="submit" formnovalidate>Done</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="deleteMealDialog">
      <form method="dialog" class="modal-panel" id="deleteMealForm">
        <div class="modal-header">
          <h2>Delete Meal</h2>
          <button class="icon-button subtle" value="cancel" type="submit" formnovalidate aria-label="Close" title="Close">x</button>
        </div>
        <p class="modal-copy" id="deleteMealMessage">Delete this meal?</p>
        <div class="modal-actions">
          <button class="button ghost" value="cancel" type="submit" formnovalidate>Cancel</button>
          <button class="button danger" value="delete" type="submit">Delete</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js?v=20260930-6"></script>
  </body>
</html>
